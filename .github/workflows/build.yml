name: Build plugin

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout BakkesMod SDK
        uses: actions/checkout@v4
        with:
          repository: bakkesmodorg/BakkesModSDK
          ref: master
          path: deps/BakkesModSDK

      - name: Configure
        shell: pwsh
        run: |
          $SdkPath = Join-Path $env:GITHUB_WORKSPACE "deps\BakkesModSDK"
          if (-not (Test-Path $SdkPath)) {
            throw "BakkesMod SDK not found at $SdkPath"
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBAKKESMOD_SDK_PATH="$SdkPath"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopMapLoader
          path: build/plugins/Release/*.dll
