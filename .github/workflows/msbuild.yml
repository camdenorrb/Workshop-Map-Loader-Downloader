name: Build plugin (MSBuild)

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Checkout BakkesMod SDK
        uses: actions/checkout@v4
        with:
          repository: bakkesmodorg/BakkesModSDK
          ref: master
          path: deps/BakkesModSDK

      - name: Prepare SDK layout
        shell: pwsh
        run: |
          $SdkSrc = Join-Path $env:GITHUB_WORKSPACE "deps\BakkesModSDK"
          $SdkRoot = Join-Path $SdkSrc "wrapper"
          $SdkDst = Join-Path $SdkRoot "bakkesmodsdk"
          $IncludeDst = Join-Path $SdkDst "include"
          $LibDst = Join-Path $SdkDst "lib"
          New-Item -ItemType Directory -Force -Path $IncludeDst | Out-Null
          New-Item -ItemType Directory -Force -Path $LibDst | Out-Null
          Copy-Item -Recurse -Force (Join-Path $SdkSrc "include\*") $IncludeDst
          Copy-Item -Recurse -Force (Join-Path $SdkSrc "lib\*") $LibDst
          Copy-Item -Force (Join-Path $SdkSrc "bakkesmod-patch.exe") $SdkDst
          "SDK_ROOT=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build with MSBuild
        shell: pwsh
        run: |
          $SdkPath = "$env:SDK_ROOT"
          if (-not (Test-Path $SdkPath)) {
            throw "BakkesMod SDK not found at $SdkPath"
          }
          $OutDir = Join-Path $env:GITHUB_WORKSPACE "build\plugins\"
          $IntDir = Join-Path $env:GITHUB_WORKSPACE "build\.intermediates\$env:CONFIGURATION\"
          msbuild Pluginx64/Pluginx64.vcxproj `
            /t:Build `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:BakkesModPath="$SdkPath" `
            /p:OutDir="$OutDir" `
            /p:IntDir="$IntDir" `
            /p:TrackFileAccess=false

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopMapLoader-msbuild
          path: build/plugins/*.dll
